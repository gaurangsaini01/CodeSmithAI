services:
  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: "/api"
    ports:
      - 80:80
    depends_on:
      - backend
    restart: unless-stopped
  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  worker:
    build: ./backend
    command: uv run arq app.worker.WorkerSettings
    volumes:
      - documents:/backend/uploads
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    restart: unless-stopped
  backend:
    build: ./backend
    volumes:
      - documents:/backend/uploads
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    restart: unless-stopped
volumes:
  documents:
