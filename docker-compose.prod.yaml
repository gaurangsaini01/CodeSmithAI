services:
  frontend:
    image: asia-south2-docker.pkg.dev/project-4d3d7acb-058d-4117-94f/codesmith/client:latest
    ports:
      - 80:80
    depends_on:
      - backend
    restart: unless-stopped
  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  worker:
    image: asia-south2-docker.pkg.dev/project-4d3d7acb-058d-4117-94f/codesmith/backend:latest
    command: uv run arq app.worker.WorkerSettings
    volumes:
      - documents:/backend/uploads
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    restart: unless-stopped
  backend:
    image: asia-south2-docker.pkg.dev/project-4d3d7acb-058d-4117-94f/codesmith/backend:latest
    volumes:
      - documents:/backend/uploads
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    restart: unless-stopped
volumes:
  documents:
